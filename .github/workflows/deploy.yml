name: Deploy Payload CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js + Payload
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      # 5. Prepare deployment package
      - name: Prepare deployment
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -r .next deploy/
          cp -r public deploy/

          cp package.json deploy/
          cp package-lock.json deploy/

          if [ -f next.config.js ]; then
            cp next.config.js deploy/
          fi

          if [ -f next.config.mjs ]; then
            cp next.config.mjs deploy/
          fi

          if [ -f next.config.ts ]; then
            cp next.config.ts deploy/
          fi

          if [ -f payload.config.ts ]; then
            cp payload.config.ts deploy/
          fi

          if [ -f payload.config.js ]; then
            cp payload.config.js deploy/
          fi

      # 6. Upload build to server
      - name: Upload to Hostinger
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/*"
          target: "/opt/payload.assistly-ai.com/current/"
          strip_components: 1

      # 7. Install production dependencies and restart PM2
      - name: Restart application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/payload.assistly-ai.com/current

            npm ci --omit=dev

            pm2 restart model01
            pm2 save
